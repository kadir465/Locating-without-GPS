[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "advanced-localization"
version = "0.1.0"
description = "GPS-independent hierarchical visual-inertial localization prototype"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-python>=4.8",
  "PyYAML>=6.0",
  "torch>=2.2",
  "kornia>=0.7",
  "lightglue @ git+https://github.com/cvg/LightGlue.git",
  "requests>=2.31",
  "rasterio>=1.3",
]

[project.optional-dependencies]
deploy = [
  "rasterio>=1.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
